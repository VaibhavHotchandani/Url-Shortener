<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="container">
    <h1>URL Shortener</h1>

    <input id="urlInput" type="url"
           placeholder="Enter your long URL">

    <button id="shortenBtn">Shorten URL</button>

    <div id="result">
        <input id="shortUrl" readonly>
        <button id="copyBtn">Copy</button>
    </div>

    <p id="message"></p>
</div>

<section class="links-section">
    <h2>Your Recent Links</h2>
    <p>View and manage all your shortened URLs.</p>

    <input
        type="text"
        id="searchInput"
        placeholder="Search your URLs..."
    >

    <p id="historyMessage">Loading links...</p>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Original URL</th>
                    <th>Short URL</th>
                    <th>Created At</th>
                    <th>Clicks</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="urlTable"></tbody>
        </table>
    </div>
</section>

<script src="script.js"></script>
</body>
</html>
